<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools Library</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e0e11">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tools">
<style>
:root {
    --bg-color: #0e0e11;
    --container-bg: #18181f;
    --input-bg: #0f0f12;
    --box-bg: #0f0f12;
    --border-color: #2d2d38;
    --border-color-hover: #3d3d4c;

    --accent-dark: #663657;      
    --accent-dark-hover: #81456e;
    --accent-light: #A77A99;
    --accent-light-hover: #c5a4bc;

    --accent-dark-50:  color-mix(in srgb, var(--accent-dark) 12%, var(--container-bg));
    --accent-dark-100: color-mix(in srgb, var(--accent-dark) 24%, var(--container-bg));
    --accent-dark-300: color-mix(in srgb, var(--accent-dark) 60%, var(--container-bg));
    --accent-dark-700: color-mix(in srgb, var(--accent-dark) 82%, black);
    --accent-focus-ring: color-mix(in srgb, var(--accent-light) 45%, transparent);

    --text-bright: #ffffff;
    --text-main: #b4b4bc;
    --text-muted: #5a5a66;
    --text-disabled: #3f3f49;
    --text-codeblock: #C77E4F;
    --text-clickable-link: #52BBE8;
    --text-clickable-link-hover: #7fd0f5;
    --text-pale-purple: #9575cd;

    --red: #e05c5c;
    --red-pale: #241616;
    --green: #4fbc75;
    --green-pale: #132118;
    --yellow: #dfb142;
    --yellow-pale: #242014;
    --success-bg: #2a4f32;
    --success-border: #3b6e47;

    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Monaco, Consolas, monospace;

    --fs-xs: 11px;
    --fs-sm: 12px;
    --fs-base: 14px;
    --fs-md: 15px;
    --fs-lg: 1.1rem;
    --fs-xl: 1.5rem;
    --fs-2xl: 1.8rem;

    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    --fw-bold: 700;

    --lh-tight: 1.3;
    --lh-normal: 1.5;
    --lh-relaxed: 1.7;
    --ls-wide: 0.5px;

    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 20px;
    --space-2xl: 24px;
    --space-3xl: 32px;
    --max-width: 900px;

    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --radius-full: 999px;
    --border-width: 1px;

    --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.3);
    --shadow-deep: 0 6px 16px rgba(0, 0, 0, 0.6);
    --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.65);

    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 0.4s cubic-bezier(0.2, 1, 0.2, 1);

    --z-dropdown: 100;
    --z-sticky: 200;
    --z-overlay: 300;
    --z-modal: 400;
    --z-toast: 500;
    --z-tooltip: 600;

    color-scheme: light dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
img { color-scheme: only light !important; }

* { scrollbar-color: var(--border-color) var(--bg-color); scrollbar-width: thin; }
::-webkit-scrollbar { width: 8px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-color); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: var(--radius-sm); }
::-webkit-scrollbar-thumb:hover { background: var(--border-color-hover); }

.footer-links img {
    color-scheme: dark !important;
    filter: brightness(0) invert(1) !important;
}

body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: var(--fs-base);
    line-height: var(--lh-normal);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-3xl) var(--space-lg);
}

@media (max-width: 768px) {
    body { padding: var(--space-lg) var(--space-sm); }
}

.wrapper {
    width: 100%;
    max-width: var(--max-width);
    display: flex;
    flex-direction: column;
    gap: var(--space-2xl);
}

.hero {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    animation: heroFade 0.5s var(--transition-slow) both;
}
@keyframes heroFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
.eyebrow {
    font-size: var(--fs-sm);
    text-transform: uppercase;
    letter-spacing: var(--ls-wide);
    color: var(--accent-light);
    font-weight: var(--fw-semibold);
}
h1 {
    margin: 0;
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    line-height: var(--lh-tight);
    color: var(--text-bright);
}
.hero p {
    margin: 0;
    font-size: var(--fs-md);
    color: var(--text-main);
    max-width: 60ch;
}

.controls {
    display: flex;
    gap: var(--space-md);
    flex-wrap: wrap;
}
.search-box {
    flex: 1 1 240px;
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    background: var(--input-bg);
    border: var(--border-width) solid var(--border-color);
    border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    transition: border-color var(--transition-fast);
}
.search-box:focus-within {
    border-color: var(--accent-light);
    box-shadow: 0 0 0 3px var(--accent-focus-ring);
}
.search-box img { width: 16px; height: 16px; opacity: 0.6; }
.search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-bright);
    font-family: var(--font-body);
    font-size: var(--fs-base);
}
.search-box input::placeholder { color: var(--text-muted); }

.sort-box {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    background: var(--input-bg);
    border: var(--border-width) solid var(--border-color);
    border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    transition: border-color var(--transition-fast);
}
.sort-box:focus-within {
    border-color: var(--accent-light);
    box-shadow: 0 0 0 3px var(--accent-focus-ring);
}
.sort-box img { width: 16px; height: 16px; opacity: 0.6; }
.sort-box select {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-bright);
    font-family: var(--font-body);
    font-size: var(--fs-base);
    cursor: pointer;
}
.sort-box select option { background: var(--container-bg); color: var(--text-bright); }

.count-line {
    font-size: var(--fs-sm);
    color: var(--text-muted);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--space-lg);
}

.tool-card {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
    background: var(--container-bg);
    border: var(--border-width) solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    text-decoration: none;
    color: inherit;
    transition: border-color var(--transition-fast);
}
.tool-card:hover { border-color: var(--border-color-hover); }
.tool-card:active {
    border-color: var(--accent-light-hover) !important;
    background: #1e1924 !important;
    transform: scale(0.98) !important;
}
.tool-card .tool-name {
    font-size: var(--fs-md);
    font-weight: var(--fw-semibold);
    color: var(--text-bright);
}
.tool-card .tool-folder {
    font-size: var(--fs-xs);
    font-family: var(--font-mono);
    color: var(--text-muted);
}
.tool-card .tool-date {
    margin-top: auto;
    padding-top: var(--space-sm);
    font-size: var(--fs-xs);
    color: var(--text-muted);
}

.empty-state, .error-state {
    text-align: center;
    padding: var(--space-3xl) var(--space-lg);
    color: var(--text-muted);
    font-size: var(--fs-md);
    border: 1px dashed var(--border-color);
    border-radius: var(--radius-lg);
}
.error-state { color: var(--red); border-color: #6b2a22; background: var(--red-pale); }

.footer {
    margin-top: var(--space-2xl, 32px);
    padding-bottom: var(--space-lg, 16px);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: var(--space-sm, 8px);
    align-items: center;
    width: 100%;
}
.footer-title { font-size: 12px; color: var(--text-muted, #5a5a66); opacity: 0.75; letter-spacing: 0.5px; }
.footer-links { display: flex; gap: var(--space-md, 12px); flex-wrap: wrap; justify-content: center; }
.footer-links a {
    display: flex; align-items: center; gap: 6px;
    color: var(--accent-light, #A77A99); text-decoration: none; font-size: 13px; opacity: 0.85;
    transition: opacity var(--transition-fast, 0.15s), color var(--transition-fast, 0.15s);
}
.footer-links a:hover { color: var(--accent-light-hover, #c5a4bc); opacity: 1; }
.footer-links img { width: 16px; height: 16px; color-scheme: dark !important; filter: brightness(0) invert(1) !important; opacity: 0.9; }
.footer-links a.kofi { color: #ff5fa2; font-weight: 500; }
.footer-links a.kofi:hover { color: #ff8fc0; }
.footer-links a.kofi img { width: 20px; height: 20px; color-scheme: dark !important; filter: brightness(0) invert(1) !important; opacity: 0.95; }
</style>
</head>
<body>

<div class="wrapper">

    <div class="hero">
        <div class="eyebrow">Internal</div>
        <h1>Tools Library</h1>
        <p>list..... of tools....</p>
    </div>

    <div class="controls">
        <div class="search-box">
            <img src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/search.png" alt="">
            <input type="text" id="search-input" placeholder="Search tools...">
        </div>
        <div class="sort-box">
            <img src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/sort.png" alt="">
            <select id="sort-select">
                <option value="date-desc">Date added (newest)</option>
                <option value="date-asc">Date added (oldest)</option>
                <option value="name-asc">Name (A–Z)</option>
                <option value="name-desc">Name (Z–A)</option>
            </select>
        </div>
    </div>

    <div id="count-line" class="count-line"></div>

    <div id="grid" class="grid"></div>

    <div class="footer">
        <div class="footer-title">By Nako Hikari</div>
        <div class="footer-links">
            <a href="https://github.com/nako-hikari/" target="_blank" class="social">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub">
                GitHub
            </a>
            <a href="https://m.youtube.com/@NaCryst" target="_blank" class="social">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube">
                YouTube
            </a>
            <a href="https://www.tiktok.com/@nako_hikari_mc" target="_blank" class="social">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok">
                TikTok
            </a>
            <a href="https://ko-fi.com/arialicee" target="_blank" class="social kofi">
                <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/kofi-icon.png" alt="Ko-fi">
                Support me on Ko-fi
            </a>
        </div>
    </div>

</div>

<script>
let allTools = [];

function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const day = 86400000;
    const days = Math.round(diffMs / day);
    if (days <= 0) return 'today';
    if (days === 1) return '1 day ago';
    if (days < 30) return days + ' days ago';
    const months = Math.round(days / 30);
    if (months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
    const years = Math.round(days / 365);
    return years + (years === 1 ? ' year ago' : ' years ago');
}

function render() {
    const query = document.getElementById('search-input').value.trim().toLowerCase();
    const sortBy = document.getElementById('sort-select').value;
    const grid = document.getElementById('grid');
    const countLine = document.getElementById('count-line');

    let filtered = allTools.filter(t => t.name.toLowerCase().includes(query));

    filtered.sort((a, b) => {
        if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
        if (sortBy === 'name-desc') return b.name.localeCompare(a.name);
        if (sortBy === 'date-asc') return new Date(a.dateAdded) - new Date(b.dateAdded);
        return new Date(b.dateAdded) - new Date(a.dateAdded); // date-desc default
    });

    countLine.textContent = allTools.length === 0
        ? ''
        : `${filtered.length} of ${allTools.length} tool${allTools.length === 1 ? '' : 's'}`;

    if (allTools.length === 0) {
        grid.innerHTML = '';
        grid.insertAdjacentHTML('afterend', '');
        return;
    }

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No tools match "${query}".</div>`;
        return;
    }

    grid.innerHTML = filtered.map(t => `
        <a class="tool-card" href="${t.path}">
            <div class="tool-name">${t.name}</div>
            <div class="tool-folder">tools/${t.folder}</div>
            <div class="tool-date">Added ${timeAgo(t.dateAdded)}</div>
        </a>
    `).join('');
}

async function loadTools() {
    const grid = document.getElementById('grid');
    try {
        const res = await fetch('/api/tools');
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        const data = await res.json();
        allTools = data.tools || [];

        if (allTools.length === 0) {
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">No tools yet. Add a folder with an index.html inside /tools.</div>';
            document.getElementById('count-line').textContent = '';
            return;
        }
        render();
    } catch (err) {
        grid.innerHTML = `<div class="error-state" style="grid-column:1/-1;">Couldn't load the tools list (${err.message}). Make sure this page is running on Vercel, not opened as a local file.</div>`;
    }
}

document.getElementById('search-input').addEventListener('input', render);
document.getElementById('sort-select').addEventListener('change', render);

loadTools();

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {
        });
    });
}
</script>

</body>
</html>
